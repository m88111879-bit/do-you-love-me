<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Propose Day 💍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="do_you_love_me.css" />
</head>

<body>
  <div class="container">

    <h1 id="question">
      Happy Propose Day 💍 <br />
      <span class="name">KUNJUUUUU</span>, will you be my girl? ❤️

    <div class="buttons">
      <button class="yes-btn" id="yesBtn">Yes 💖</button>

    <!-- Romantic section (hidden initially) -->

      <p id="countdown" class="countdown"></p>
      <p id="typing" class="typing"></p>

      <button id="open-letter" style="display:none;">
        Read my letter 💌
      </button>
    </div>

  </div>

  <!-- Background Music -->
  <audio id="bg-music" src="Merge_Ee-Kattu-Vannu_1.mp3" preload="auto"></audio>

  <!-- JS (IMPORTANT: must be LAST) -->
  <script src="do_you_love_me.js"></script>
</body>
</html>
