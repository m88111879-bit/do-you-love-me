<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Just a small question 🍓</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: linear-gradient(135deg, #fff1f5, #ffe4ec);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 25px;
      max-width: 340px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      animation: fadeIn 2s ease;
    }

    h2 {
      color: #b0003a;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .ok {
      background: #ff7aa2;
      color: white;
    }

    .think {
      background: #f0f0f0;
      color: #444;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Can we choose each other… slowly? 🍓</h2>

    <p>
      No rush.  
      No pressure.  
      I just wanted to be honest with you.
    </p>

    <button class="ok" onclick="yes()">Okay… 💗</button>
    <button class="think" onclick="think()">Let me think 🌼</button>
  </div>

  <script>
    function yes() {
      window.location.href = "marry.html";
    }

    function think() {
      alert("That’s perfectly okay 😊\nTake all the time you need.");
    }
  </script>

</body>
</html>
