<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Marry Me?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to top, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      animation: pop 1s ease;
      max-width: 90%;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #e6005c;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #444;
      margin-bottom: 25px;
    }

    .buttons button {
      font-size: 18px;
      padding: 12px 25px;
      margin: 10px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background: #ff3366;
      color: white;
    }

    .yes:hover {
      background: #ff004c;
      transform: scale(1.1);
    }

    .no {
      background: #ddd;
      color: #555;
    }

    .no:hover {
      transform: translateX(20px);
    }

    .result {
      margin-top: 20px;
      font-size: 22px;
      display: none;
      color: #e6005c;
    }

    .gif {
      margin-top: 15px;
      max-width: 200px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>💍 Will You Marry Me?</h1>

    <p>
      From today, tomorrow, and forever…  
      I want every smile, every silence, every heartbeat — with you ❤️
    </p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">YES 💖</button>
      <button class="no" onclick="sayNo()">NO 🙈</button>
    </div>

    <div class="result" id="result"></div>

    <!-- Optional GIF -->
    <img
      id="gif"
      class="gif"
      src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUydjQweTh4djZyZXBoaXQ5MWRrM3BpOXJsbHB3c3plMmZhNmwxaXI4aiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Y9bboRSDSw0CezsCji/giphy.gif"
      alt="cute gif">
  </div>

  <script>
    function vibrateSoft() {
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
    }

    function sayYes() {
      vibrateSoft();
      document.getElementById("result").innerText =
        "She said YES 😭❤️💍";
      document.getElementById("result").style.display = "block";
      document.getElementById("gif").style.display = "block";
    }

    function sayNo() {
      vibrateSoft();
      document.getElementById("result").innerText =
        "Are you sure? 🥺👉👈";
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
